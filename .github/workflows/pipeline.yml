name: CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  build-test-scan-push-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: python -m pip install -r app/requirements.txt

      - name: Run tests
        run: python -m pytest app/test_app.py -v

      - name: Build Docker image
        run: docker build -t system-status-dashboard ./app

      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: system-status-dashboard
          format: table
          exit-code: 1
          severity: CRITICAL,HIGH

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag Docker image
        if: github.event_name == 'push'
        run: docker tag system-status-dashboard ghcr.io/${{ github.repository_owner }}/system-status-dashboard:latest

      - name: Push Docker image
        if: github.event_name == 'push'
        run: docker push ghcr.io/${{ github.repository_owner }}/system-status-dashboard:latest

      - name: Log in to Azure
        if: github.event_name == 'push'
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure VM
        if: github.event_name == 'push'
        run: |
          az vm run-command invoke \
            --resource-group rg-system-status-dashboard \
            --name system-status-vm \
            --command-id RunShellScript \
            --scripts '
              set -e
              cd /home/azureuser/system-status-dashboard
              docker compose pull flask-app
              docker compose up -d flask-app
              docker compose ps flask-app
            '
