apiVersion: 1
groups:
  - orgId: 1
    name: system-monitoring
    folder: System Monitoring Alerts
    interval: 1m
    rules:
      - uid: efvecf8mbbqwwd
        title: Flask Application Down
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: up{job="flask-app"}
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            queryType: expression
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 1
                    type: lt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: NoData
        execErrState: Error
        for: 1m
        annotations:
          description: Prometheus cannot reach the Flask application for at least one minute.
          summary: Flask application is unavailable
        labels:
          service: flask-app
          severity: critical
        isPaused: false
      - uid: afvegaidtafwgf
        title: High Host CPU Usage
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: 100 * (1 - avg(rate(node_cpu_seconds_total{job="node-exporter", mode="idle"}[5m])))
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            queryType: expression
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 85
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          description: CPU usage has remained above 85% for at least five minutes.
          summary: Host CPU usage is high
        labels:
          service: host
          severity: warning
        isPaused: false
      - uid: cfvegink7rcowf
        title: High Host Disk Usage
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              editorMode: code
              expr: "100 * (\r\n  1 - (\r\n    node_filesystem_avail_bytes{\r\n      job=\"node-exporter\",\r\n      fstype=~\"ext4|xfs\",\r\n      mountpoint=~\"^/$|^/mnt/docker-desktop-disk$\"\r\n    }\r\n    /\r\n    node_filesystem_size_bytes{\r\n      job=\"node-exporter\",\r\n      fstype=~\"ext4|xfs\",\r\n      mountpoint=~\"^/$|^/mnt/docker-desktop-disk$\"\r\n    }\r\n  )\r\n)"
              instant: true
              intervalMs: 1000
              legendFormat: __auto
              maxDataPoints: 43200
              range: false
              refId: A
          - refId: C
            queryType: expression
            datasourceUid: __expr__
            model:
              conditions:
                - evaluator:
                    params:
                      - 85
                    type: gt
                  operator:
                    type: and
                  query:
                    params:
                      - C
                  reducer:
                    params: []
                    type: last
                  type: query
              datasource:
                type: __expr__
                uid: __expr__
              expression: A
              intervalMs: 1000
              maxDataPoints: 43200
              refId: C
              type: threshold
        noDataState: NoData
        execErrState: Error
        for: 5m
        annotations:
          description: Disk usage has remained above 85% for at least five minutes.
          summary: Host disk usage is high
        labels:
          service: host
          severity: warning
        isPaused: false
